services:
  - type: web
    name: stt-webapp
    env: python
    buildCommand: pip install -r webapp/requirements.txt
    startCommand: python webapp/app.py
    envVars:
      - key: SITE_PASSWORD
        sync: false
      - key: FLASK_SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
