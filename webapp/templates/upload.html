<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>STT 웹앱</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="page">
    <header class="site-header">
      <span class="logo">STT<span class="caret">▍</span></span>
      <p class="tagline">🎧 음성/영상을 텍스트로 옮깁니다 <span class="tagline-sub">(STT)</span></p>
    </header>

    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post" action="{{ url_for('transcribe') }}" enctype="multipart/form-data" id="transcribe-form" class="card">
      <div class="advanced">
        <button type="button" id="advanced-toggle" class="action-row advanced-toggle">
          <span class="chevron">›</span>
          <span class="toggle-label">고급 옵션</span>
        </button>

        <div id="advanced-options" hidden>
          <div class="segmented" role="radiogroup" aria-label="STT 제공자 선택">
            <label>
              <input type="radio" name="provider" value="groq" class="visually-hidden" {% if provider == 'groq' %}checked{% endif %}>
              <span>Groq</span>
            </label>
            <label>
              <input type="radio" name="provider" value="openai" class="visually-hidden" {% if provider == 'openai' %}checked{% endif %}>
              <span>OpenAI</span>
            </label>
          </div>

          <div id="api-key-box">
            <label class="field-label" for="api-key">API 키</label>
            <div class="field">
              <input type="password" name="api_key" id="api-key" placeholder="직접 입력 (선택)">
              <button type="button" id="toggle-api-key" class="icon-btn">👁</button>
            </div>
            <label class="checkbox-row"><input type="checkbox" id="save-api-key"> 이 브라우저에 API 키 저장</label>
          </div>
        </div>
      </div>

      <div class="file-field">
        <input type="file" name="file" id="file-input" accept=".webm,.mp4,.mp3" required class="visually-hidden">
        <label for="file-input" class="action-row file-label">
          <span class="file-label-text">파일 선택 <span class="file-hint">(오디오/영상 파일)</span></span>
          <span class="file-name" id="file-name"></span>
        </label>
      </div>

      <button type="submit" class="action-row btn-primary">텍스트로 변환하기</button>
    </form>

    {% if result %}
    <section class="results card" id="results-section">
      <h2>변환 결과</h2>
      <ul class="segments">
        {% for seg in result.segments %}
        <li><span class="timecode">{{ seg.start }} → {{ seg.end }}</span><span class="seg-text">{{ seg.text }}</span></li>
        {% endfor %}
      </ul>
      <p class="downloads">
        <a href="{{ url_for('download', uuid_str=result.id, filename=result.txt_name) }}">TXT 다운로드</a>
        <a href="{{ url_for('download', uuid_str=result.id, filename=result.srt_name) }}">SRT 다운로드</a>
      </p>
      <div class="result-actions">
        <span class="char-count">{{ result.text|length }}자</span>
        <button type="button" id="copy-btn" class="icon-btn">복사</button>
        <button type="button" id="clear-btn" class="icon-btn">전체지우기</button>
      </div>
      <textarea id="result-text" class="visually-hidden" readonly>{{ result.text }}</textarea>
    </section>
    {% endif %}
  </div>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
  <script>
    toggleVisibility("api-key", "toggle-api-key");
    initApiKeyAutoSave("api-key", "save-api-key", document.getElementById("transcribe-form"));
    initProviderAutoSave("provider", document.getElementById("transcribe-form"));
    initApiKeyBoxToggle("provider", "api-key-box", document.getElementById("transcribe-form"));
    initAdvancedToggle();
    initFileNameDisplay("file-input", "file-name");
    initResultActions("copy-btn", "clear-btn", "result-text", "results-section");
  </script>
</body>
</html>
